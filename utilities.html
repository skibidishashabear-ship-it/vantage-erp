<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vantage Utilities - Fleet & Expenses</title>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --accent: #10B981;
      --accent-light: #ECFDF5;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --danger: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; -webkit-tap-highlight-color: transparent; }
    
    header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    .brand { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .nav-links { display: flex; justify-content: center; gap: 8px; }
    .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: bold; padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; }
    .nav-links a.active { background: var(--accent-light); color: var(--accent); }
    .nav-links a:hover { background: var(--border); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.05); }
    .card h3 { color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    
    button { background: var(--accent); color: white; border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    button.outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.danger { background: var(--danger); }
    input, select { padding: 12px; border: 1px solid var(--border); border-radius: 6px; width: 100%; margin-bottom: 12px; font-size: 1rem; min-height: 44px; background: var(--bg); color: var(--text); }
    label { font-size: 0.8rem; font-weight: bold; color: var(--text-muted); display: block; margin-bottom: 4px; }
    
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 15px; white-space: nowrap; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--accent-light); color: var(--accent); }
    
    .result-box { background: var(--accent-light); border: 1px solid var(--accent); padding: 15px; border-radius: 6px; margin-top: 15px; font-size: 1.2rem; font-weight: bold; text-align: center; color: var(--accent); }

    @media (max-width: 600px) {
      header { grid-template-columns: 1fr; gap: 10px; text-align: center; }
      .nav-links { justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">Vantage Utilities</div>
  <div class="nav-links">
    <a href="index.html">Dashboard & Trips</a>
    <a href="#" class="active">Expenses & Maintenance</a>
  </div>
  <div></div>
</header>

<div class="grid">
  <!-- Calculator Module -->
  <div class="card">
    <h3>⛽ Fuel Cost Estimator</h3>
    <div>
      <label>Unit System</label>
      <select id="calc-unit" onchange="updateCalcLabels()">
        <option value="gallons">Gallons (Miles per Gallon - MPG)</option>
        <option value="liters">Liters (Km per Liter - KPL)</option>
      </select>
      
      <label id="lbl-dist">Distance</label>
      <input type="number" id="calc-dist" placeholder="e.g. 150" step="any" inputmode="decimal" oninput="calculateFuel()">
      
      <label id="lbl-eff">Fuel Efficiency</label>
      <input type="number" id="calc-eff" placeholder="e.g. 8" step="any" inputmode="decimal" oninput="calculateFuel()">
      
      <label id="lbl-price">Fuel Price per Unit (AED)</label>
      <input type="number" id="calc-price" value="11.50" step="any" inputmode="decimal" oninput="calculateFuel()">
    </div>
    <div class="result-box">
      Estimated Cost: <span id="calc-result">0.00</span> AED
    </div>
  </div>

  <!-- Expense Logger -->
  <div class="card">
    <h3>📉 Log Business Expense</h3>
    <form onsubmit="addExpense(event)">
      <label>Date</label><input type="date" id="e-date" required>
      <label>Category</label>
      <select id="e-cat">
        <option>Driver Allowance</option>
        <option>Vehicle Maintenance</option>
        <option>Permits / Government Fees</option>
        <option>Office / Admin</option>
        <option>Miscellaneous</option>
      </select>
      <label>Description</label>
      <input type="text" id="e-desc" placeholder="e.g. Oil change for 85017-J" inputmode="text" required>
      <label>Amount (AED)</label>
      <input type="number" id="e-amount" step="any" inputmode="decimal" required>
      <button type="submit" style="width:100%;">➕ Log Expense</button>
    </form>
  </div>
</div>

<!-- Expense History Table -->
<div class="card" style="margin-bottom: 20px;">
  <h3>Expense History Log</h3>
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Category</th>
          <th>Description</th>
          <th>Amount (AED)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="expensesBody"></tbody>
    </table>
  </div>

  <!-- Expenses Pagination Controls -->
  <div id="expensePagination" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 5px 0;">
    <button class="outline" id="prevExpBtn" onclick="prevExpensePage()" style="display:none;">Previous Page</button>
    <span id="expPageIndicator" style="font-size: 0.9rem; color: var(--text-muted); font-weight: bold;">Page 1</span>
    <button class="outline" id="nextExpBtn" onclick="nextExpensePage()" style="display:none;">Next Page</button>
  </div>
</div>

<!-- Maintenance Log -->
<div class="card">
  <h3>Fleet Maintenance & Renewals</h3>
  <form onsubmit="addMaintenance(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: flex-end; margin-bottom: 15px;">
    <div><label>Plate No.</label><input type="text" id="m-plate" placeholder="e.g. 85017-J" inputmode="text" autocapitalize="characters" required></div>
    <div><label>Service / Renewal Type</label><input type="text" id="m-type" placeholder="e.g. Mulkiya Renewal" inputmode="text" required></div>
    <div><label>Next Due Date</label><input type="date" id="m-due" required></div>
    <button type="submit">➕ Add Record</button>
  </form>
  
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Plate No.</th>
          <th>Service/Renewal</th>
          <th>Next Due Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="maintenanceBody"></tbody>
    </table>
  </div>

  <!-- Maintenance Pagination Controls -->
  <div id="maintPagination" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 5px 0;">
    <button class="outline" id="prevMaintBtn" onclick="prevMaintPage()" style="display:none;">Previous Page</button>
    <span id="maintPageIndicator" style="font-size: 0.9rem; color: var(--text-muted); font-weight: bold;">Page 1</span>
    <button class="outline" id="nextMaintBtn" onclick="nextMaintPage()" style="display:none;">Next Page</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDfYzDRXRd8DD7bPPznLqEsjn6shn1Obvc",
    authDomain: "vantage-erp.firebaseapp.com",
    projectId: "vantage-erp",
    storageBucket: "vantage-erp.firebasestorage.app",
    messagingSenderId: "291156677597",
    appId: "1:291156677597:web:5680c5db276e7e3d9b5c34"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let expensesData = [];
  let maintenanceData = [];

  let lastExpDoc = null;
  let expHistory = [];
  let expCurrentPage = 1;

  let lastMaintDoc = null;
  let maintHistory = [];
  let maintCurrentPage = 1;

  const PAGE_SIZE = 20;

  document.getElementById('e-date').value = new Date().toISOString().split('T')[0];

  function updateCalcLabels() {
    const isGal = document.getElementById('calc-unit').value === 'gallons';
    document.getElementById('lbl-dist').innerText = isGal ? 'Distance (Miles)' : 'Distance (Kilometers)';
    document.getElementById('lbl-eff').innerText = isGal ? 'Fuel Efficiency (MPG)' : 'Fuel Efficiency (Km/L)';
    document.getElementById('lbl-price').innerText = isGal ? 'Fuel Price per Gallon (AED)' : 'Fuel Price per Liter (AED)';
    calculateFuel();
  }
  
  function calculateFuel() {
    const dist = parseFloat(document.getElementById('calc-dist').value) || 0;
    const eff = parseFloat(document.getElementById('calc-eff').value) || 0;
    const price = parseFloat(document.getElementById('calc-price').value) || 0;
    if (eff > 0) {
      const cost = (dist / eff) * price;
      document.getElementById('calc-result').innerText = cost.toFixed(2);
    } else {
      document.getElementById('calc-result').innerText = "0.00";
    }
  }

  async function addExpense(e) {
    e.preventDefault();
    const expense = {
      timestamp: Date.now(),
      date: document.getElementById('e-date').value,
      category: document.getElementById('e-cat').value,
      desc: document.getElementById('e-desc').value,
      amount: parseFloat(document.getElementById('e-amount').value) || 0
    };

    try {
      await db.collection("expenses").add(expense);
      e.target.reset();
      document.getElementById('e-date').value = new Date().toISOString().split('T')[0];
      loadExpensesPage('initial');
    } catch (err) {
      alert("Error adding expense: " + err.message);
    }
  }

  async function deleteExpense(id) {
    if (confirm('Delete this expense record?')) {
      try {
        await db.collection("expenses").doc(id).delete();
        loadExpensesPage('initial');
      } catch (err) {
        alert("Error deleting expense: " + err.message);
      }
    }
  }

  function loadExpensesPage(direction = 'initial') {
    let query = db.collection("expenses").orderBy("timestamp", "desc").limit(PAGE_SIZE);

    if (direction === 'next' && lastExpDoc) {
      query = query.startAfter(lastExpDoc);
    } else if (direction === 'prev' && expHistory.length > 0) {
      expHistory.pop();
      const prevDoc = expHistory[expHistory.length - 1];
      if (prevDoc) {
        query = db.collection("expenses").orderBy("timestamp", "desc").startAfter(prevDoc).limit(PAGE_SIZE);
      }
    } else if (direction === 'initial') {
      expCurrentPage = 1;
      expHistory = [];
    }

    query.get().then((snapshot) => {
      expensesData = [];
      snapshot.forEach((doc) => {
        expensesData.push({ id: doc.id, ...doc.data() });
      });

      if (!snapshot.empty) {
        lastExpDoc = snapshot.docs[snapshot.docs.length - 1];
        if (direction === 'next' && !expHistory.includes(snapshot.docs[0])) {
          expHistory.push(snapshot.docs[0]);
        } else if (direction === 'initial' && snapshot.docs.length > 0) {
          expHistory.push(snapshot.docs[0]);
        }
      }

      renderExpenses();
      renderExpControls(snapshot.size);
    }).catch(err => console.error("Error loading expenses:", err));
  }

  function nextExpensePage() {
    expCurrentPage++;
    loadExpensesPage('next');
  }

  function prevExpensePage() {
    if (expCurrentPage > 1) {
      expCurrentPage--;
      loadExpensesPage('prev');
    }
  }

  function renderExpControls(fetchedCount) {
    const prevBtn = document.getElementById('prevExpBtn');
    const nextBtn = document.getElementById('nextExpBtn');
    const indicator = document.getElementById('expPageIndicator');

    if (indicator) indicator.innerText = `Page ${expCurrentPage}`;
    if (prevBtn) prevBtn.style.display = expCurrentPage > 1 ? 'inline-flex' : 'none';
    if (nextBtn) nextBtn.style.display = (fetchedCount === PAGE_SIZE) ? 'inline-flex' : 'none';
  }

  function renderExpenses() {
    const tbody = document.getElementById('expensesBody');
    tbody.innerHTML = '';
    expensesData.forEach(x => {
      const formattedDate = x.date ? x.date.split('-').reverse().join('/') : 'N/A';
      tbody.innerHTML += `
        <tr>
          <td>${formattedDate}</td>
          <td><strong>${x.category}</strong></td>
          <td>${x.desc}</td>
          <td><strong>${(x.amount || 0).toFixed(2)} AED</strong></td>
          <td><button class="danger" style="padding: 4px 8px; min-height: 32px;" onclick="deleteExpense('${x.id}')">Delete</button></td>
        </tr>
      `;
    });
  }

  async function addMaintenance(e) {
    e.preventDefault();
    const record = {
      timestamp: Date.now(),
      plate: document.getElementById('m-plate').value,
      type: document.getElementById('m-type').value,
      due: document.getElementById('m-due').value
    };

    try {
      await db.collection("maintenance").add(record);
      e.target.reset();
      loadMaintenancePage('initial');
    } catch (err) {
      alert("Error adding maintenance record: " + err.message);
    }
  }

  async function deleteMaintenance(id) {
    if (confirm('Delete this maintenance record?')) {
      try {
        await db.collection("maintenance").doc(id).delete();
        loadMaintenancePage('initial');
      } catch (err) {
        alert("Error deleting maintenance: " + err.message);
      }
    }
  }

  function loadMaintenancePage(direction = 'initial') {
    let query = db.collection("maintenance").orderBy("timestamp", "desc").limit(PAGE_SIZE);

    if (direction === 'next' && lastMaintDoc) {
      query = query.startAfter(lastMaintDoc);
    } else if (direction === 'prev' && maintHistory.length > 0) {
      maintHistory.pop();
      const prevDoc = maintHistory[maintHistory.length - 1];
      if (prevDoc) {
        query = db.collection("maintenance").orderBy("timestamp", "desc").startAfter(prevDoc).limit(PAGE_SIZE);
      }
    } else if (direction === 'initial') {
      maintCurrentPage = 1;
      maintHistory = [];
    }

    query.get().then((snapshot) => {
      maintenanceData = [];
      snapshot.forEach((doc) => {
        maintenanceData.push({ id: doc.id, ...doc.data() });
      });

      if (!snapshot.empty) {
        lastMaintDoc = snapshot.docs[snapshot.docs.length - 1];
        if (direction === 'next' && !maintHistory.includes(snapshot.docs[0])) {
          maintHistory.push(snapshot.docs[0]);
        } else if (direction === 'initial' && snapshot.docs.length > 0) {
          maintHistory.push(snapshot.docs[0]);
        }
      }

      renderMaintenance();
      renderMaintControls(snapshot.size);
    }).catch(err => console.error("Error loading maintenance:", err));
  }

  function nextMaintPage() {
    maintCurrentPage++;
    loadMaintenancePage('next');
  }

  function prevMaintPage() {
    if (maintCurrentPage > 1) {
      maintCurrentPage--;
      loadMaintenancePage('prev');
    }
  }

  function renderMaintControls(fetchedCount) {
    const prevBtn = document.getElementById('prevMaintBtn');
    const nextBtn = document.getElementById('nextMaintBtn');
    const indicator = document.getElementById('maintPageIndicator');

    if (indicator) indicator.innerText = `Page ${maintCurrentPage}`;
    if (prevBtn) prevBtn.style.display = maintCurrentPage > 1 ? 'inline-flex' : 'none';
    if (nextBtn) nextBtn.style.display = (fetchedCount === PAGE_SIZE) ? 'inline-flex' : 'none';
  }

  function renderMaintenance() {
    const tbody = document.getElementById('maintenanceBody');
    tbody.innerHTML = '';
    const today = new Date();
    
    maintenanceData.forEach(m => {
      const dueDate = new Date(m.due);
      const diffTime = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
      
      let statusHtml = `<span style="color:var(--accent); font-weight:bold;">Active (${diffTime} days left)</span>`;
      if (diffTime <= 7 && diffTime >= 0) statusHtml = `<span style="color:#F59E0B; font-weight:bold;">Due Soon (${diffTime} days)</span>`;
      if (diffTime < 0) statusHtml = `<span style="color:var(--danger); font-weight:bold;">OVERDUE by ${Math.abs(diffTime)} days</span>`;

      const formattedDue = m.due ? m.due.split('-').reverse().join('/') : 'N/A';

      tbody.innerHTML += `
        <tr>
          <td><strong>${m.plate}</strong></td>
          <td>${m.type}</td>
          <td>${formattedDue}</td>
          <td>${statusHtml}</td>
          <td><button class="danger" style="padding: 4px 8px; min-height: 32px;" onclick="deleteMaintenance('${m.id}')">Delete</button></td>
        </tr>
      `;
    });
  }

  updateCalcLabels();
  loadExpensesPage('initial');
  loadMaintenancePage('initial');
</script>
</body>
</html>
