<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vantage Utilities - Fleet & Expenses</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --accent: #10B981;
      --accent-light: #ECFDF5;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --danger: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    
    /* Centered Header Grid Layout */
    header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    .brand { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
    .nav-links { display: flex; justify-content: center; gap: 10px; }
    .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: bold; padding: 8px 16px; border-radius: 6px; }
    .nav-links a.active { background: var(--accent-light); color: var(--accent); }
    .nav-links a:hover { background: var(--border); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.05); }
    .card h3 { color: var(--text-muted); text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    
    button { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button.danger { background: var(--danger); }
    input, select { padding: 8px; border: 1px solid var(--border); border-radius: 5px; width: 100%; margin-bottom: 10px; }
    label { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 15px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--accent-light); color: var(--accent); }
    
    .result-box { background: var(--accent-light); border: 1px solid var(--accent); padding: 15px; border-radius: 5px; margin-top: 15px; font-size: 1.2rem; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<header>
  <div class="brand">Vantage Utilities</div>
  <div class="nav-links">
    <a href="index.html">Dashboard & Trips</a>
    <a href="#" class="active">Expenses & Maintenance</a>
  </div>
  <div></div>
</header>

<div class="grid">
  <!-- Calculator Module -->
  <div class="card">
    <h3>⛽ Fuel Cost Estimator</h3>
    <div>
      <label>Unit System</label>
      <select id="calc-unit" onchange="updateCalcLabels()">
        <option value="gallons">Gallons (Miles per Gallon - MPG)</option>
        <option value="liters">Liters (Km per Liter - KPL)</option>
      </select>
      
      <label id="lbl-dist">Distance</label>
      <input type="number" id="calc-dist" placeholder="e.g. 150" step="any" oninput="calculateFuel()">
      
      <label id="lbl-eff">Fuel Efficiency</label>
      <input type="number" id="calc-eff" placeholder="e.g. 8" step="any" oninput="calculateFuel()">
      
      <label id="lbl-price">Fuel Price per Unit (AED)</label>
      <input type="number" id="calc-price" value="11.50" step="any" oninput="calculateFuel()">
    </div>
    <div class="result-box">
      Estimated Cost: <span id="calc-result">0.00</span> AED
    </div>
  </div>

  <!-- Expense Logger -->
  <div class="card">
    <h3>📉 Log Business Expense</h3>
    <form onsubmit="addExpense(event)">
      <label>Date</label><input type="date" id="e-date" required>
      <label>Category</label>
      <select id="e-cat">
        <option>Driver Allowance</option>
        <option>Vehicle Maintenance</option>
        <option>Permits / Government Fees</option>
        <option>Office / Admin</option>
        <option>Miscellaneous</option>
      </select>
      <label>Description</label>
      <input type="text" id="e-desc" placeholder="e.g. Oil change for 85017-J" required>
      <label>Amount (AED)</label>
      <input type="number" id="e-amount" step="any" required>
      <button type="submit">➕ Log Expense</button>
    </form>
  </div>
</div>

<!-- Expense History Table -->
<div class="card" style="margin-bottom: 20px;">
  <h3>Expense History Log</h3>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Category</th>
        <th>Description</th>
        <th>Amount (AED)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="expensesBody"></tbody>
  </table>
</div>

<!-- Maintenance Log -->
<div class="card">
  <h3>Fleet Maintenance & Renewals</h3>
  <form onsubmit="addMaintenance(event)" style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 15px;">
    <div style="flex: 1;"><label>Plate No.</label><input type="text" id="m-plate" required></div>
    <div style="flex: 2;"><label>Service / Renewal Type</label><input type="text" id="m-type" placeholder="e.g. Mulkiya Renewal" required></div>
    <div style="flex: 1;"><label>Next Due Date</label><input type="date" id="m-due" required></div>
    <button type="submit">➕ Add Record</button>
  </form>
  
  <table>
    <thead>
      <tr>
        <th>Plate No.</th>
        <th>Service/Renewal</th>
        <th>Next Due Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="maintenanceBody"></tbody>
  </table>
</div>

<script>
  let db = JSON.parse(localStorage.getItem('vantage_db')) || { trips: [], invoiceCounter: 0, expenses: [], maintenance: [] };
  
  if(!db.expenses) db.expenses = [];
  if(!db.maintenance) db.maintenance = [];

  function saveDB() { localStorage.setItem('vantage_db', JSON.stringify(db)); renderExpenses(); renderMaintenance(); }
  document.getElementById('e-date').value = new Date().toISOString().split('T')[0];

  function updateCalcLabels() {
    const isGal = document.getElementById('calc-unit').value === 'gallons';
    document.getElementById('lbl-dist').innerText = isGal ? 'Distance (Miles)' : 'Distance (Kilometers)';
    document.getElementById('lbl-eff').innerText = isGal ? 'Fuel Efficiency (MPG)' : 'Fuel Efficiency (Km/L)';
    document.getElementById('lbl-price').innerText = isGal ? 'Fuel Price per Gallon (AED)' : 'Fuel Price per Liter (AED)';
    calculateFuel();
  }
  
  function calculateFuel() {
    const dist = parseFloat(document.getElementById('calc-dist').value) || 0;
    const eff = parseFloat(document.getElementById('calc-eff').value) || 0;
    const price = parseFloat(document.getElementById('calc-price').value) || 0;
    if (eff > 0) {
      const cost = (dist / eff) * price;
      document.getElementById('calc-result').innerText = cost.toFixed(2);
    } else {
      document.getElementById('calc-result').innerText = "0.00";
    }
  }

  function addExpense(e) {
    e.preventDefault();
    db.expenses.push({
      id: Date.now(),
      date: document.getElementById('e-date').value,
      category: document.getElementById('e-cat').value,
      desc: document.getElementById('e-desc').value,
      amount: parseFloat(document.getElementById('e-amount').value)
    });
    saveDB(); e.target.reset(); document.getElementById('e-date').value = new Date().toISOString().split('T')[0];
  }

  function deleteExpense(id) {
    db.expenses = db.expenses.filter(x => x.id !== id);
    saveDB();
  }

  function renderExpenses() {
    const tbody = document.getElementById('expensesBody');
    tbody.innerHTML = '';
    db.expenses.forEach(x => {
      tbody.innerHTML += `
        <tr>
          <td>${x.date.split('-').reverse().join('/')}</td>
          <td><strong>${x.category}</strong></td>
          <td>${x.desc}</td>
          <td><strong>${x.amount.toFixed(2)} AED</strong></td>
          <td><button class="danger" style="padding: 4px 8px;" onclick="deleteExpense(${x.id})">Delete</button></td>
        </tr>
      `;
    });
  }

  function addMaintenance(e) {
    e.preventDefault();
    db.maintenance.push({
      id: Date.now(),
      plate: document.getElementById('m-plate').value,
      type: document.getElementById('m-type').value,
      due: document.getElementById('m-due').value
    });
    saveDB(); e.target.reset();
  }

  function deleteMaintenance(id) {
    db.maintenance = db.maintenance.filter(m => m.id !== id);
    saveDB();
  }

  function renderMaintenance() {
    const tbody = document.getElementById('maintenanceBody');
    tbody.innerHTML = '';
    const today = new Date();
    
    db.maintenance.sort((a, b) => new Date(a.due) - new Date(b.due)).forEach(m => {
      const dueDate = new Date(m.due);
      const diffTime = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
      
      let statusHtml = `<span style="color:var(--accent); font-weight:bold;">Active (${diffTime} days left)</span>`;
      if (diffTime <= 7 && diffTime >= 0) statusHtml = `<span style="color:#F59E0B; font-weight:bold;">Due Soon (${diffTime} days)</span>`;
      if (diffTime < 0) statusHtml = `<span style="color:var(--danger); font-weight:bold;">OVERDUE by ${Math.abs(diffTime)} days</span>`;

      tbody.innerHTML += `
        <tr>
          <td><strong>${m.plate}</strong></td>
          <td>${m.type}</td>
          <td>${m.due.split('-').reverse().join('/')}</td>
          <td>${statusHtml}</td>
          <td><button class="danger" style="padding: 4px 8px;" onclick="deleteMaintenance(${m.id})">Delete</button></td>
        </tr>
      `;
    });
  }

  updateCalcLabels();
  renderExpenses();
  renderMaintenance();
</script>
</body>
</html>
